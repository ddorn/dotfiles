# Electron on Wayland. niri has no X server (no xwayland-satellite), so apps must
# render on Wayland. `--ozone-platform-hint=auto` doesn't reliably select it here
# (leaves e.g. Obsidian hung on startup), so force it explicitly. Keep
# --enable-features on ONE line: Chromium keeps only the LAST such flag.
--ozone-platform=wayland
--enable-features=UseOzonePlatform,WaylandWindowDecorations
