# User override of /usr/share/xdg-desktop-portal/niri-portals.conf (a config file
# of the same name in ~/.config wins wholesale — it is NOT merged — so this must
# restate everything from the shipped file).
#
# niri ships `default=gnome;gtk`, which routes FileChooser to xdg-desktop-portal-
# gnome first. Both gnome and gtk *declare* FileChooser, so gnome is chosen — but
# its FileChooser doesn't work outside a real GNOME session ("No such interface
# org.freedesktop.impl.portal.FileChooser"), so file dialogs (Firefox save, etc.)
# silently fail. Force FileChooser to the gtk backend, which implements it.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
